[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sieve-promotion-bot"
version = "1.0.0"
description = "Sieve: bounded asynchronous promotion filter for Telegram and Pelando"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
  "Telethon>=1.36,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
]

[project.scripts]
sieve = "promo_bot.cli:main"

[tool.setuptools.packages.find]
include = ["promo_bot*"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "contract: opt-in live provider contract tests",
  "soak: long-running 100,000-promotion bounded-memory test",
]
