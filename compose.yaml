name: sieve

services:
  sieve:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    env_file:
      - .env
    environment:
      SIEVE_CONFIG: /app/config/config.yaml
      SIEVE_LOG_LEVEL: ${SIEVE_LOG_LEVEL:-INFO}
    command: ["--config", "/app/config/config.yaml", "run"]
    volumes:
      - sieve-state:/state
      - type: bind
        source: ${SIEVE_CONFIG_FILE:-./config/config.yaml}
        target: /app/config/config.yaml
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 256m
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "sieve", "--config", "/app/config/config.yaml", "health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  sieve-state:
