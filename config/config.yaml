runtime:
  queue_capacity: 256
  memory_limit_mb: 220
  failure_alert_threshold: 3
  llm_outage_alert_seconds: 300

state:
  path: /state/sieve.db
  media_path: /state/media
  retention_days: 30
  retention_cap: 50000
  corpus_limit: 10000
  retry_limit: 100
  retry_ttl_seconds: 3600

pipeline:
  gemini_evaluation_enabled: false
  bm25_threshold: 2.0
  bm25_auto_forward_threshold: 7.0
  bm25_auto_forward_mode: shadow
  bm25_below_threshold_audit_rate: 0.05
  bm25_k1: 1.2
  bm25_b: 0.75
  cold_start_documents: 500
  exceptional_temperature: 300
  profile: ""
  aliases: {}
  hard_rules:
    - id: prohibited_promotions
      priority: 100
      action: deny
      any: [aposta, cassino, bet, renda extra]

evaluator:
  factory: promo_bot.evaluator:create_gemini_evaluator
  settings:
    max_output_tokens: 160

gemini:
  api_key_env: GEMINI_API_KEY
  model: gemini-3.1-flash-lite
  provider_url: https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent
  timeout_seconds: 20
  retries: 3
  thinking_level: minimal
  stages:
    extraction:
      schema_version: promotion-extraction-v1
      prompt_version: promotion-extraction-prompt-v1
      max_input_chars: 12000
      max_output_tokens: 900
    verification:
      schema_version: promotion-verification-v1
      prompt_version: promotion-verification-prompt-v1
      max_input_chars: 20000
      max_output_tokens: 700
    localization:
      schema_version: promotion-localization-v1
      prompt_version: promotion-localization-prompt-v1
      max_input_chars: 8000
      max_output_tokens: 500
    reason:
      schema_version: promotion-reason-v1
      prompt_version: promotion-reason-prompt-v1
      max_input_chars: 1000
      max_output_tokens: 120

preferences:
  enabled: false
  admin_telegram_user_id_env: TELEGRAM_ADMIN_USER_ID
  max_users: 10
  token_env: TELEGRAM_BOT_TOKEN
  api_url: https://api.telegram.org
  polling_timeout: 30
  queue_capacity: 20
  rate_per_minute: 5
  rate_per_hour: 20
  confirmation_ttl_seconds: 600
  max_entries: 500
  max_operations: 25
  max_state_bytes: 131072
  parser: {}

sink:
  factory: promo_bot.sink:create_telegram_sink
  settings:
    token_env: TELEGRAM_BOT_TOKEN
    api_url: https://api.telegram.org
    timeout_seconds: 15
    media_timeout_seconds: 15
    media_max_bytes: 10485760

sources:
  - name: telegram-principal
    factory: promo_bot.sources.telegram:create_telegram_source
    enabled: false
    settings:
      api_id_env: TELEGRAM_API_ID
      api_hash_env: TELEGRAM_API_HASH
      session_path: /state/telegram-user
      chat_ids: []

  - name: pelando
    factory: promo_bot.sources.pelando:create_pelando_source
    enabled: false
    settings:
      url: https://www.pelando.com.br/recentes
      interval_seconds: 120
      timeout_seconds: 20
      user_agent: sieve/1.1.0-beta.1 (+private-use)
